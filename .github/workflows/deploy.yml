name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ----------------------------------------
      # Verify Node.js
      # ----------------------------------------
      - name: Verify Node.js
        run: |
          node --version
          npm --version

      # ----------------------------------------
      # Install dependencies
      # ----------------------------------------
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      # ----------------------------------------
      # Select environment and build
      # ----------------------------------------
      - name: Build Application
        shell: bash
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then

            echo "======================================"
            echo "Production deployment"
            echo "======================================"

            npm run build:prod

            echo "S3_BUCKET=mycircles-admin-panel-prod" >> "$GITHUB_ENV"
            echo "CLOUDFRONT_ID=${{ secrets.CLOUDFRONT_ID_PROD }}" >> "$GITHUB_ENV"

          elif [ "${{ github.ref_name }}" = "develop" ]; then

            echo "======================================"
            echo "Development deployment"
            echo "======================================"

            npm run build:dev

            echo "S3_BUCKET=mycircles-web-dev" >> "$GITHUB_ENV"
            echo "CLOUDFRONT_ID=${{ secrets.CLOUDFRONT_ID }}" >> "$GITHUB_ENV"

          else

            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1

          fi

          echo "======================================"
          echo "Build completed"
          echo "S3 Bucket: $S3_BUCKET"
          echo "======================================"

      # ----------------------------------------
      # Configure AWS using OIDC
      # ----------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: GitHubActions-${{ github.run_id }}

      # ----------------------------------------
      # Verify AWS identity
      # ----------------------------------------
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      # ----------------------------------------
      # Upload to S3
      # ----------------------------------------
      - name: Upload to S3
        run: |
          echo "======================================"
          echo "Uploading build to S3"
          echo "Bucket: $S3_BUCKET"
          echo "======================================"

          aws s3 sync ./build \
            "s3://$S3_BUCKET" \
            --delete

          echo "S3 deployment completed."

      # ----------------------------------------
      # CloudFront invalidation
      # ----------------------------------------
      - name: Create CloudFront Invalidation
        run: |
          echo "======================================"
          echo "Creating CloudFront invalidation"
          echo "Distribution: $CLOUDFRONT_ID"
          echo "======================================"

          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"

          echo "CloudFront invalidation created."

      # ----------------------------------------
      # Deployment summary
      # ----------------------------------------
      - name: Deployment Completed
        run: |
          echo "======================================"
          echo "Frontend deployment successful"
          echo "======================================"
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Node       : $(node --version)"
          echo "S3 Bucket  : $S3_BUCKET"
          echo "CloudFront : $CLOUDFRONT_ID"
          echo "======================================"

